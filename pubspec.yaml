name: hubaal_shop
description: "HUBAAL SHOP - Professional Multi-Store Shop Management & Debt Tracking System"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.0

  # Supabase Backend
  supabase_flutter: ^2.5.6

  # Offline Database (SQLite)
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.21
  path_provider: ^2.1.3
  path: ^1.9.0

  # Financial & Utilities
  uuid: ^4.4.0
  intl: ^0.19.0
  crypto: ^3.0.3

  # Reports & Printing
  pdf: ^3.10.8
  printing: ^5.13.1
  share_plus: ^9.0.0

  # Icons & UI
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2
  build_runner: ^2.4.9
  drift_dev: ^2.18.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/icons/
